<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Match | CricAI</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="icon" href="data:;base64,=">
</head>
<body>
  <div class="ambient-mesh"></div>

  <header class="navbar">
    <a href="/" class="brand"><div class="brand-dot"></div>CricAI</a>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="./training.html">Training</a>
    </nav>
  </header>

  <main class="container fade-up">
    <!-- Back link -->
    <a href="/" class="btn btn-ghost" style="margin-bottom:1.5rem;border-radius:999px;font-size:0.8rem;padding:0.4rem 1rem;">← Back</a>

    <!-- Score Hero -->
    <div id="scoreHero" class="glass score-hero section">
      <div style="margin-bottom:0.5rem;"><span class="live-badge" id="liveBadge">LIVE</span></div>
      <p class="teams" id="matchTeams">-- vs --</p>
      <p class="score-big"><span id="scoreRuns">0</span><span class="slash">/<span id="scoreWk">0</span></span>
        <span style="font-size:1.5rem;color:var(--text-muted)">(<span id="scoreOv">0.0</span> ov)</span></p>
      <p class="muted" id="targetLine" style="margin-top:0.5rem;"></p>
      <div class="meta-strip" id="metaStrip"></div>
    </div>

    <!-- Session Predictions -->
    <div class="section">
      <p class="label" style="margin-bottom:0.75rem;">AI Session Predictions</p>
      <div class="stat-grid stat-grid-4" id="sessionGrid"></div>
    </div>

    <!-- Batsmen & Bowlers -->
    <div class="two-col section">
      <div class="glass pad">
        <p class="panel-header">At The Crease</p>
        <div id="batsmenPanel"></div>
      </div>
      <div class="glass pad">
        <p class="panel-header">Bowling</p>
        <div id="bowlersPanel"></div>
      </div>
    </div>

    <!-- Prediction Outlook -->
    <div class="glass pad section" style="text-align:center;">
      <p class="label" style="margin-bottom:0.5rem;">Match Prediction</p>
      <p style="font-size:1.5rem;font-weight:900;color:var(--primary);" id="winnerText">--</p>
      <p class="muted" id="partnershipText"></p>
    </div>

    <!-- Recent Balls + Over Summary -->
    <div class="two-col section">
      <div class="glass pad">
        <p class="panel-header">Recent Deliveries</p>
        <div class="ball-strip" id="recentBalls"></div>
      </div>
      <div class="glass pad">
        <p class="panel-header">Previous Innings</p>
        <div id="prevInnings"><p class="muted">--</p></div>
      </div>
    </div>

    <!-- Playing XI -->
    <div class="two-col section">
      <div class="glass pad" id="xi1">
        <p class="panel-header" id="xi1Title">Team 1</p>
        <ul class="xi-list" id="xi1List"></ul>
      </div>
      <div class="glass pad" id="xi2">
        <p class="panel-header" id="xi2Title">Team 2</p>
        <ul class="xi-list" id="xi2List"></ul>
      </div>
    </div>

    <p class="muted" style="text-align:center;margin-top:1rem;font-size:0.8rem;" id="statusLine">Loading...</p>
  </main>

  <script src="./js/match.js"></script>
</body>
</html>
