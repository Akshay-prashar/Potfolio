<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Pilot | AI Scout</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Alpine.js for lightweight reactivity -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>

<body x-data="{ sidebarOpen: false }">

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" :class="{ 'open': sidebarOpen }">
            <div class="sidebar-header">
                <div class="sidebar-title">Configuration</div>
            </div>

            <div class="sidebar-content">
                <!-- Papers Count -->
                <div class="control-group">
                    <label class="control-label">Papers to Fetch</label>
                    <div class="range-wrapper">
                        <input type="range" id="papersRange" min="10" max="100" value="40"
                            oninput="document.getElementById('papersVal').innerText = this.value">
                        <span id="papersVal" class="range-value">40</span>
                    </div>
                </div>

                <!-- Top N Summaries -->
                <div class="control-group">
                    <label class="control-label">Summarize Top N</label>
                    <div class="range-wrapper">
                        <input type="range" id="topRange" min="3" max="20" value="10"
                            oninput="document.getElementById('topVal').innerText = this.value">
                        <span id="topVal" class="range-value">10</span>
                    </div>
                </div>

                <!-- Toggles -->
                <div class="control-group">
                    <label class="toggle-row">
                        <span class="control-label" style="margin:0">Auto-Cluster Results</span>
                        <input type="checkbox" id="autoCluster" class="toggle-input" style="display:none" checked>
                        <div class="toggle-switch"></div>
                    </label>
                </div>

                <div class="control-group">
                    <label class="toggle-row">
                        <span class="control-label" style="margin:0">Generate Bullets</span>
                        <input type="checkbox" id="genBullets" class="toggle-input" style="display:none" checked>
                        <div class="toggle-switch"></div>
                    </label>
                </div>

                <!-- File Upload -->
                <div class="control-group">
                    <label class="control-label">Upload CSV (Optional)</label>
                    <label class="file-upload-btn">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span id="fileName">Choose a CSV file...</span>
                        <input type="file" id="csvUpload" accept=".csv" style="display:none"
                            onchange="document.getElementById('fileName').innerText = this.files[0]?.name || 'Choose a CSV file...'">
                    </label>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="control-label">Export Results</div>
                <div style="display:flex; gap:10px;">
                    <button id="btnExportPdf" class="btn btn-secondary" style="flex:1" disabled>
                        <i class="fas fa-file-pdf"></i> PDF
                    </button>
                    <button id="btnExportCsv" class="btn btn-secondary" style="flex:1" disabled>
                        <i class="fas fa-file-csv"></i> CSV
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Mobile Menu Button -->
            <button class="btn btn-secondary mobile-menu-btn" @click="sidebarOpen = !sidebarOpen">
                <i class="fas fa-bars"></i>
            </button>

            <div class="hero-section">
                <h1 class="app-title">Research Pilot</h1>
                <p class="app-subtitle">AI-Powered Literature Scout & Summarizer</p>

                <div class="search-container">
                    <div class="search-input-wrapper">
                        <input type="text" id="topicInput" class="search-input"
                            placeholder="Enter a research topic (e.g., 'Large Language Models in Healthcare')..."
                            onkeydown="if(event.key==='Enter') window.startJob()">
                        <button class="search-btn" onclick="window.startJob()">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>

                <!-- Status Bar (Hidden initially) -->
                <div id="statusBar" class="status-bar">
                    <div class="status-text" id="statusText">Initializing...</div>
                    <div class="progress-track">
                        <div id="progressBar" class="progress-fill"></div>
                    </div>
                    <div class="status-text" style="min-width:60px; text-align:right" id="statusPercent">0%</div>
                </div>
            </div>

            <!-- Results List -->
            <div class="results-container">
                <div id="resultsGrid" class="results-grid">
                    <!-- Cards will be injected here -->
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
